<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Glow Block Blast Extreme</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05020c;
  font-family: 'Outfit', sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
}

#app {
  width: 100%;
  max-width: 420px;
  height: 100%;
  max-height: 860px;
  background: radial-gradient(circle at 50% 0%, #120826 0%, #040108 100%);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

@media (min-width: 430px) and (min-height: 870px) {
  #app { border-radius: 32px; height: 92vh; }
}

.bg-glow {
  position: absolute;
  width: 250px;
  height: 250px;
  background: #7c3aed;
  filter: blur(110px);
  opacity: 0.2;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0;
}

.stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.25; }

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px 20px 30px;
  z-index: 2;
}
#gs, #gov { display: none; }

/* HOME SCREEN */
.brand-box { text-align: center; margin-top: 15px; }
.hs-title {
  font-size: 46px;
  font-weight: 900;
  letter-spacing: -1.5px;
  background: linear-gradient(135deg, #fff 30%, #c084fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
}
.hs-sub { color: #a78bfa; font-size: 11px; letter-spacing: 6px; text-transform: uppercase; margin-top: 2px; font-weight: 800; }

.deco-container { display: flex; gap: 6px; justify-content: center; margin: 35px 0; }
.deco-block { width: 20px; height: 20px; border-radius: 5px; box-shadow: 0 0 10px var(--glow); background: var(--bg); }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.stat-card {
  border-radius: 16px; padding: 12px 6px; text-align: center;
  background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
}
.stat-ico { font-size: 16px; margin-bottom: 2px; }
.stat-v { font-size: 18px; font-weight: 800; }
.stat-l { color: #475569; font-size: 9px; text-transform: uppercase; font-weight: 700; }

.btn-primary {
  width: 100%; background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
  color: #fff; border: none; border-radius: 16px; padding: 18px;
  font-size: 18px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer;
  box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35); transition: transform 0.1s;
}
.btn-primary:active { transform: scale(0.98); }

/* GAME SCREEN */
.topbar { display: flex; align-items: center; gap: 10px; width: 100%; }
.btn-icon {
  width: 46px; height: 46px; background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px;
  display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
}
.score-box { flex: 1; display: flex; gap: 8px; }
.score-p { flex: 1; border-radius: 14px; padding: 4px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); }
.score-l { color: #475569; font-size: 9px; text-transform: uppercase; font-weight: 700; }
.score-v { font-size: 18px; font-weight: 800; }

/* GRID SYSTEMS */
.grid-container {
  width: 100%; background: rgba(1, 0, 4, 0.8); border-radius: 20px;
  padding: 8px; border: 1px solid rgba(255, 255, 255, 0.04); position: relative;
}
#grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.cell { aspect-ratio: 1; border-radius: 5px; background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.02); position: relative; }

.cell.filled { border: none; }
.cell.pok { background: rgba(168, 85, 247, 0.3) !important; border: 1px solid #a855f7 !important; }
.cell.pbad { background: rgba(239, 68, 68, 0.25) !important; border: 1px solid #ef4444 !important; }
.cell.clearing { transform: scale(0); opacity: 0; transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s linear; border: none; z-index: 5; }

.block-inner { width: 100%; height: 100%; border-radius: 5px; box-shadow: inset 0 1.5px 3px rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.3); }

/* TRAY SYSTEM */
.tray {
  width: 100%; background: rgba(255,255,255,0.01); border-radius: 18px;
  padding: 10px 4px; display: flex; justify-content: space-around; align-items: center;
  min-height: 125px; border: 1px solid rgba(255, 255, 255, 0.02);
}
/* Katta shakllar sig'ishi uchun slot o'lchami biroz kengaytirildi */
.slot { display: flex; align-items: center; justify-content: center; width: 110px; height: 110px; cursor: grab; }
.slot.used { opacity: 0; pointer-events: none; }
.slot.lifted { opacity: 0.15; transform: scale(0.8); }

.pgrid { display: grid; gap: 2px; }
.pc { border-radius: 3px; box-shadow: inset 0 1px 2px rgba(255,255,255,0.3); }
.pc.e { background: transparent !important; box-shadow: none !important; }

#float { position: fixed; pointer-events: none; z-index: 9999; transform: scale(1.1); will-change: top, left; filter: drop-shadow(0 12px 20px rgba(0,0,0,0.6)); }

.footer-bar { display: flex; gap: 8px; width: 100%; }
.pill { flex: 1; border-radius: 12px; padding: 8px 14px; background: rgba(255,255,255,0.01); border: 1px solid rgba(255, 255, 255, 0.04); display: flex; justify-content: space-between; align-items: center; }
.pill-l { color: #475569; font-size: 9px; text-transform: uppercase; font-weight: 700; }
.pill-v { font-size: 13px; font-weight: 700; }

.combo-overlay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); opacity: 0; pointer-events: none; z-index: 50;
  background: linear-gradient(135deg, #ec4899, #a855f7); padding: 10px 24px; border-radius: 50px; font-weight: 900; font-size: 20px;
  box-shadow: 0 8px 24px rgba(168, 85, 247, 0.5); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s linear;
}
.combo-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.score-pop { position: absolute; color: #fbbf24; font-size: 18px; font-weight: 900; pointer-events: none; z-index: 60; text-shadow: 0 2px 8px rgba(0,0,0,0.8); will-change: transform, opacity; transition: transform 0.5s ease-out, opacity 0.5s linear; }

/* GAME OVER */
#gov { background: rgba(3, 1, 6, 0.98); align-items: center; justify-content: center; gap: 20px; }
.go-title { font-size: 36px; font-weight: 900; color: #ef4444; text-transform: uppercase; letter-spacing: -0.5px; }
.go-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 24px; text-align: center; width: 85%; }
.go-num { font-size: 50px; font-weight: 900; margin: 6px 0; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.go-best { color: #fbbf24; font-size: 13px; font-weight: 600; }
.btn-sec { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #64748b; border-radius: 14px; padding: 12px 24px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<div id="app">
  <div class="bg-glow"></div>
  <div class="stars" id="stars"></div>

  <div id="hs" class="screen">
    <div class="brand-box">
      <h1 class="hs-title">Glow Blast</h1>
      <div class="hs-sub">Extreme Strategy</div>
    </div>
    <div class="deco-container" id="deco-box"></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-ico">🏆</div><div class="stat-v" id="hs-best">0</div><div class="stat-l">Best</div></div>
      <div class="stat-card"><div class="stat-ico">🎮</div><div class="stat-v" id="hs-games">0</div><div class="stat-l">Played</div></div>
      <div class="stat-card"><div class="stat-ico">⚡</div><div class="stat-v" id="hs-lines">0</div><div class="stat-l">Lines</div></div>
    </div>
    <button class="btn-primary" id="start-btn">START BLASTING</button>
  </div>

  <div id="gs" class="screen">
    <div class="topbar">
      <button class="btn-icon" id="home-btn">🏠</button>
      <div class="score-box">
        <div class="score-p"><div class="score-l">Score</div><div class="score-v" id="sc-val">0</div></div>
        <div class="score-p"><div class="score-l">Best</div><div class="score-v" id="best-val">0</div></div>
      </div>
    </div>
    
    <div class="grid-container">
      <div id="grid"></div>
      <div class="combo-overlay" id="combo-box">COMBO! 🔥</div>
    </div>
    
    <div class="footer-bar">
      <div class="pill"><span class="pill-l">Lines</span><span class="pill-v" id="v-lines">0</span></div>
      <div class="pill"><span class="pill-l">Blocks</span><span class="pill-v" id="v-blocks">0</span></div>
    </div>
    
    <div class="tray" id="tray"></div>
  </div>

  <div id="gov" class="screen">
    <div class="go-title">No More Moves</div>
    <div class="go-box">
      <div class="score-l">Final Score</div>
      <div class="go-num" id="go-score">0</div>
      <div class="go-best" id="go-best">Best: 0</div>
    </div>
    <button class="btn-primary" id="replay-btn">TRY AGAIN</button>
    <button class="btn-sec" id="go-home-btn">MAIN MENU</button>
  </div>

  <div id="float" style="display:none;"></div>
</div>

<script>
const CONFIG = { rows: 8, cols: 8, dragOffsetY: 60, cellSize: 32 };

const COLORS = [
  { bg: '#ff0055', glow: 'rgba(255,0,85,0.35)' },
  { bg: '#00ffcc', glow: 'rgba(0,255,204,0.35)' },
  { bg: '#3300ff', glow: 'rgba(51,0,255,0.35)' },
  { bg: '#ffcc00', glow: 'rgba(255,204,0,0.35)' },
  { bg: '#ff00ff', glow: 'rgba(255,0,255,0.35)' },
  { bg: '#00ff00', glow: 'rgba(0,255,0,0.35)' }
];

// DRY & BALANCED SHAPE DICTIONARY
// O'yin cheksiz bo'lib qolmasligi uchun qiyin va katta bloklar qo'shildi
const SHAPES_POOL = {
  easy: [
    { c: [[0,0]], w: 1, h: 1 },
    { c: [[0,0],[0,1]], w: 2, h: 1 }, { c: [[0,0],[1,0]], w: 1, h: 2 },
    { c: [[0,0],[1,0],[1,1]], w: 2, h: 2 }
  ],
  medium: [
    { c: [[0,0],[0,1],[0,2]], w: 3, h: 1 }, { c: [[0,0],[1,0],[2,0]], w: 1, h: 3 },
    { c: [[0,0],[0,1],[1,0],[1,1]], w: 2, h: 2 },
    { c: [[0,0],[1,0],[1,1],[1,2]], w: 3, h: 2 },
    { c: [[0,0],[0,1],[0,2],[1,1]], w: 3, h: 2 }
  ],
  hard: [
    // 4 talik va 5 talik uzun chiziqlar (Joyni juda tez to'ldiradi)
    { c: [[0,0],[0,1],[0,2],[0,3]], w: 4, h: 1 }, { c: [[0,0],[1,0],[2,0],[3,0]], w: 1, h: 4 },
    { c: [[0,0],[0,1],[0,2],[0,3],[0,4]], w: 5, h: 1 }, { c: [[0,0],[1,0],[2,0],[3,0],[4,0]], w: 1, h: 5 },
    // Katta L-shakllari (3x3)
    { c: [[0,0],[1,0],[2,0],[2,1],[2,2]], w: 3, h: 3 },
    { c: [[0,0],[0,1],[0,2],[1,2],[2,2]], w: 3, h: 3 },
    // 3x3 To'liq Kvadrat (O'yinni yutqaztiradigan eng asosiy blok!)
    { c: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], w: 3, h: 3 }
  ]
};

const State = {
  board: [], score: 0, best: 0, games: 0, lines: 0, blocks: 0,
  pieces: [null, null, null], dragging: false, activeIdx: -1,
  shape: null, color: null, gridRect: null, cellsElements: []
};

const Storage = {
  get(key, def) { try { return +localStorage.getItem('gbe_'+key) || def; } catch { return def; } },
  set(key, val) { try { localStorage.setItem('gbe_'+key, val); } catch {} }
};

function loadStats() {
  State.best = Storage.get('best', 0);
  State.games = Storage.get('games', 0);
  State.lines = Storage.get('lines', 0);
}

function saveStats() {
  Storage.set('best', State.best);
  Storage.set('games', State.games);
  Storage.set('lines', State.lines);
}

function createBlockElement(bg, glow, size) {
  const wrapper = document.createElement('div'); wrapper.className = 'pc';
  wrapper.style.cssText = `width:${size}px;height:${size}px;background:${bg};box-shadow:0 0 6px ${glow};`;
  const inner = document.createElement('div'); inner.className = 'block-inner';
  wrapper.appendChild(inner);
  return wrapper;
}

function initGame() {
  State.board = Array.from({ length: CONFIG.rows }, () => Array(CONFIG.cols).fill(null));
  State.score = 0; State.blocks = 0; State.pieces = [null, null, null]; State.dragging = false;
  generatePieces(); buildGridUI(); renderBoard(); renderPieces(); updateUI();
}

function buildGridUI() {
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  State.cellsElements = [];
  for (let r = 0; r < CONFIG.rows; r++) {
    for (let c = 0; c < CONFIG.cols; c++) {
      const cell = document.createElement('div'); cell.className = 'cell';
      grid.appendChild(cell); State.cellsElements.push(cell);
    }
  }
}

function getCellElement(r, c) { return State.cellsElements[r * CONFIG.cols + c]; }

// DYNAMIC DIFFICULTY GENERATOR
// Ochko ko'paygani sayin qiyin shakllar chiqish ehtimoli keskin oshadi
function getRandomShape() {
  const r = Math.random();
  if (State.score < 400) {
    return r < 0.6 ? SHAPES_POOL.easy[Math.floor(Math.random() * SHAPES_POOL.easy.length)] : SHAPES_POOL.medium[Math.floor(Math.random() * SHAPES_POOL.medium.length)];
  } else if (State.score < 1200) {
    if (r < 0.25) return SHAPES_POOL.easy[Math.floor(Math.random() * SHAPES_POOL.easy.length)];
    if (r < 0.75) return SHAPES_POOL.medium[Math.floor(Math.random() * SHAPES_POOL.medium.length)];
    return SHAPES_POOL.hard[Math.floor(Math.random() * SHAPES_POOL.hard.length)];
  } else {
    // 1200 ochkodan keyin o'yin haqiqiy "Survial" rejimga o'tadi (45% ehtimol bilan eng qiyin shakllar)
    if (r < 0.15) return SHAPES_POOL.easy[Math.floor(Math.random() * SHAPES_POOL.easy.length)];
    if (r < 0.55) return SHAPES_POOL.medium[Math.floor(Math.random() * SHAPES_POOL.medium.length)];
    return SHAPES_POOL.hard[Math.floor(Math.random() * SHAPES_POOL.hard.length)];
  }
}

function generatePieces() {
  for (let i = 0; i < 3; i++) {
    if (!State.pieces[i]) {
      State.pieces[i] = {
        sh: getRandomShape(),
        col: COLORS[Math.floor(Math.random() * COLORS.length)]
      };
    }
  }
}

function renderBoard(previewCells, isOk, clearingCells) {
  const clrSet = clearingCells ? new Set(clearingCells.map(([r,c]) => `${r},${c}`)) : null;
  const prevSet = previewCells ? new Set(previewCells.map(([r,c]) => `${r},${c}`)) : null;

  for (let r = 0; r < CONFIG.rows; r++) {
    for (let c = 0; c < CONFIG.cols; c++) {
      const el = getCellElement(r, c); const cellState = State.board[r][c]; const key = `${r},${c}`;
      el.className = 'cell'; el.innerHTML = ''; el.style.background = ''; el.style.boxShadow = '';

      if (clrSet && clrSet.has(key)) {
        el.classList.add('clearing'); el.style.background = cellState ? cellState.bg : '#fff';
      } else if (cellState) {
        el.classList.add('filled'); el.style.background = cellState.bg; el.style.boxShadow = `0 0 6px ${cellState.glow}`;
        el.appendChild(createBlockElement(cellState.bg, cellState.glow, '100%'));
      } else if (prevSet && prevSet.has(key)) {
        el.classList.add(isOk ? 'pok' : 'pbad');
      }
    }
  }
}

function renderPieces() {
  const tray = document.getElementById('tray'); tray.innerHTML = '';
  State.pieces.forEach((p, i) => {
    const slot = document.createElement('div'); slot.className = 'slot' + (p ? '' : ' used');
    if (p) {
      const pgrid = document.createElement('div'); pgrid.className = 'pgrid';
      // Traddagi kichik pgrid o'lchami shakl kengligiga qarab moslashadi (optimal vizual o'lcham: 15px)
      pgrid.style.gridTemplateColumns = `repeat(${p.sh.w}, 15px)`;
      for (let r = 0; r < p.sh.h; r++) {
        for (let c = 0; c < p.sh.w; c++) {
          if (p.sh.c.some(([rr, cc]) => rr === r && cc === c)) pgrid.appendChild(createBlockElement(p.col.bg, p.col.glow, 15));
          else { const empty = document.createElement('div'); empty.className = 'pc e'; empty.style.cssText = 'width:15px;height:15px;'; pgrid.appendChild(empty); }
        }
      }
      slot.appendChild(pgrid);
      slot.addEventListener('mousedown', e => startDrag(e, i));
      slot.addEventListener('touchstart', e => startDrag(e, i), { passive: false });
    }
    tray.appendChild(slot);
  });
}

function updateUI() {
  document.getElementById('sc-val').textContent = State.score;
  document.getElementById('best-val').textContent = State.best;
  document.getElementById('v-lines').textContent = State.lines;
  document.getElementById('v-blocks').textContent = State.blocks;
}

function getPointerPos(e) { const t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; }

function getGridTarget(x, y) {
  const cellW = State.gridRect.width / CONFIG.cols; const cellH = State.gridRect.height / CONFIG.rows;
  return {
    row: Math.round((y - State.gridRect.top) / cellH - State.shape.h / 2),
    col: Math.round((x - State.gridRect.left) / cellW - State.shape.w / 2)
  };
}

function testPlacement(cells, rOffset, cOffset) {
  return cells.every(([r, c]) => {
    const nr = r + rOffset, nc = c + cOffset;
    return nr >= 0 && nr < CONFIG.rows && nc >= 0 && nc < CONFIG.cols && !State.board[nr][nc];
  });
}

function startDrag(e, idx) {
  if (!State.pieces[idx]) return; e.preventDefault();
  State.dragging = true; State.activeIdx = idx;
  const p = State.pieces[idx]; State.shape = p.sh; State.color = p.col;
  State.gridRect = document.getElementById('grid').getBoundingClientRect();

  const floatBox = document.getElementById('float'); floatBox.style.display = 'block'; floatBox.innerHTML = '';
  const pgrid = document.createElement('div'); pgrid.className = 'pgrid';
  pgrid.style.cssText = `grid-template-columns:repeat(${p.sh.w}, ${CONFIG.cellSize}px); gap: 3px;`;
  for (let r = 0; r < p.sh.h; r++) {
    for (let c = 0; c < p.sh.w; c++) {
      if (p.sh.c.some(([rr, cc]) => rr === r && cc === c)) pgrid.appendChild(createBlockElement(p.col.bg, p.col.glow, CONFIG.cellSize));
      else { const ev = document.createElement('div'); ev.style.cssText = `width:${CONFIG.cellSize}px;height:${CONFIG.cellSize}px;`; pgrid.appendChild(ev); }
    }
  }
  floatBox.appendChild(pgrid);
  document.getElementById('tray').children[idx]?.classList.add('lifted');

  handleDrag(e);
  document.addEventListener('mousemove', handleDrag); document.addEventListener('touchmove', handleDrag, { passive: false });
  document.addEventListener('mouseup', endDrag); document.addEventListener('touchend', endDrag);
}

function handleDrag(e) {
  if (!State.dragging) return; e.preventDefault();
  const { x, y } = getPointerPos(e); const floatBox = document.getElementById('float');
  const adjustedY = y - CONFIG.dragOffsetY;
  floatBox.style.left = `${x - (State.shape.w * CONFIG.cellSize) / 2}px`;
  floatBox.style.top = `${adjustedY - (State.shape.h * CONFIG.cellSize) / 2}px`;

  const target = getGridTarget(x, adjustedY);
  const previewCells = State.shape.c.map(([r, c]) => [r + target.row, c + target.col]);
  renderBoard(previewCells, testPlacement(State.shape.c, target.row, target.col));
}

function endDrag(e) {
  if (!State.dragging) return; State.dragging = false;
  document.removeEventListener('mousemove', handleDrag); document.removeEventListener('touchmove', handleDrag);
  document.removeEventListener('mouseup', endDrag); document.removeEventListener('touchend', endDrag);

  document.getElementById('float').style.display = 'none';
  document.getElementById('tray').children[State.activeIdx]?.classList.remove('lifted');

  const endEv = e.changedTouches ? e.changedTouches[0] : e;
  const target = getGridTarget(endEv.clientX, endEv.clientY - CONFIG.dragOffsetY);

  if (testPlacement(State.shape.c, target.row, target.col)) executePlacement(State.activeIdx, target.row, target.col);
  else renderBoard();
}

function executePlacement(idx, row, col) {
  const p = State.pieces[idx]; const placed = [];
  p.sh.c.forEach(([r, c]) => { State.board[r + row][c + col] = p.col; placed.push([r + row, c + col]); });
  State.pieces[idx] = null; State.blocks += p.sh.c.length; State.score += p.sh.c.length;

  triggerScorePopup(p.sh.c.length, row, col);
  setTimeout(() => evaluateLines(), 80);
}

function evaluateLines() {
  const rowsToClear = [], colsToClear = [];
  for (let r = 0; r < CONFIG.rows; r++) if (State.board[r].every(v => v)) rowsToClear.push(r);
  for (let c = 0; c < CONFIG.cols; c++) if (State.board.map(row => row[c]).every(v => v)) colsToClear.push(c);

  const clearCoordinates = [];
  rowsToClear.forEach(r => { for(let c=0; c<CONFIG.cols; c++) clearCoordinates.push([r, c]); });
  colsToClear.forEach(c => { for(let r=0; r<CONFIG.rows; r++) clearCoordinates.push([r, c]); });

  if (clearCoordinates.length > 0) {
    const totalLines = rowsToClear.length + colsToClear.length; State.lines += totalLines;
    renderBoard(null, false, clearCoordinates);
    setTimeout(() => {
      clearCoordinates.forEach(([r, c]) => State.board[r][c] = null);
      const points = totalLines * 100 + clearCoordinates.length * 5; State.score += points;
      if (totalLines >= 2) triggerCombo(totalLines);
      triggerScorePopup(points, clearCoordinates[0][0], clearCoordinates[0][1]);
      if (State.score > State.best) { State.best = State.score; saveStats(); }
      postPlacementCheck();
    }, 220);
  } else {
    if (State.score > State.best) { State.best = State.score; saveStats(); }
    postPlacementCheck();
  }
}

function postPlacementCheck() {
  if (State.pieces.every(p => p === null)) generatePieces();
  renderPieces(); renderBoard(); updateUI();
  // Qat'iy mag'lubiyat tekshiruvi
  if (!checkAvailableMoves()) {
    setTimeout(() => { State.games++; saveStats(); showGameOver(); }, 250);
  }
}

// 100% ANIQ TEKSHIRUV ALGORITMI (CRITICAL GAME OVER TIMING)
function checkAvailableMoves() {
  return State.pieces.some(p => {
    if (!p) return false; // Bo'sh slotlarni tekshirmaydi
    // Maydonning har bir nuqtasini tekshirib chiqadi
    for (let r = 0; r < CONFIG.rows; r++) {
      for (let c = 0; c < CONFIG.cols; c++) {
        if (testPlacement(p.sh.c, r, c)) return true; // Atigi bitta bo'sh joy topilsa ham o'yin davom etadi
      }
    }
    return false;
  });
}

function triggerCombo(count) {
  const box = document.getElementById('combo-box');
  box.textContent = count > 2 ? `🔥 ${count}X MEGA BLAST! 🔥` : '🔥 COMBO! 🔥';
  box.classList.add('show'); setTimeout(() => box.classList.remove('show'), 650);
}

function triggerScorePopup(pts, r, c) {
  const app = document.getElementById('app');
  const cellW = State.gridRect.width / CONFIG.cols; const cellH = State.gridRect.height / CONFIG.rows;
  const x = State.gridRect.left - app.getBoundingClientRect().left + c * cellW + cellW / 2;
  const y = State.gridRect.top - app.getBoundingClientRect().top + r * cellH;

  const pop = document.createElement('div'); pop.className = 'score-pop'; pop.textContent = `+${pts}`;
  pop.style.cssText = `left:${x}px; top:${y}px; transform:translate(-50%, 0); opacity:1;`;
  app.appendChild(pop);

  requestAnimationFrame(() => { pop.style.transform = 'translate(-50%, -35px)'; pop.style.opacity = '0'; });
  setTimeout(() => pop.remove(), 500);
}

function showScreen(id) { ['hs', 'gs', 'gov'].forEach(s => document.getElementById(s).style.display = 'none'); document.getElementById(id).style.display = 'flex'; }
function showHome() { showScreen('hs'); document.getElementById('hs-best').textContent = State.best; document.getElementById('hs-games').textContent = State.games; document.getElementById('hs-lines').textContent = State.lines; }
function showGameOver() { document.getElementById('go-score').textContent = State.score; document.getElementById('go-best').textContent = State.score >= State.best ? '🏆 NEW RECORD!' : `Best: ${State.best}`; showScreen('gov'); }

function buildStaticStars() {
  const sw = document.getElementById('stars'); sw.innerHTML = ''; const fr = document.createDocumentFragment();
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div'); s.className = 'star';
    s.style.cssText = `width:1.5px; height:1.5px; left:${Math.random()*100}%; top:${Math.random()*100}%; opacity:${0.1 + Math.random()*0.3}`;
    fr.appendChild(s);
  }
  sw.appendChild(fr);
}

function buildMenuDeco() {
  const box = document.getElementById('deco-box'); box.innerHTML = '';
  COLORS.forEach(c => {
    const b = document.createElement('div'); b.className = 'deco-block'; b.style.cssText = `--bg:${c.bg}; --glow:${c.glow};`;
    box.appendChild(b);
  });
}

loadStats(); buildStaticStars(); buildMenuDeco();
document.getElementById('start-btn').addEventListener('click', () => { showScreen('gs'); initGame(); });
document.getElementById('home-btn').addEventListener('click', showHome);
document.getElementById('go-home-btn').addEventListener('click', showHome);
document.getElementById('replay-btn').addEventListener('click', () => { showScreen('gs'); initGame(); });

showHome();
</script>
