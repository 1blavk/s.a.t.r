<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Blast - Optimized Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

body {
  background: #0b0f19;
  font-family: 'Nunito', sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; color: #fff;
}

#app {
  width: 390px; height: 844px;
  background: linear-gradient(180deg, #1d4ed8 0%, #172554 100%);
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden; position: relative; border-radius: 32px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.45);
}

/* ─── SCREENS ─── */
#hs, #gs, #gov { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; position: relative; }
#gs, #gov { display: none; }

/* ─── HOME SCREEN ─── */
#hs { justify-content: space-between; padding: 70px 24px 60px; }
.hs-title-box { text-align: center; }
.hs-main-title { font-family: 'Fredoka', cursive; font-size: 56px; font-weight: 700; color: #fff; text-shadow: 0 6px 16px rgba(0,0,0,0.35); line-height: 1.1; }
.hs-sub-title { color: #60a5fa; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; margin-top: 10px; font-weight: 900; }

.hs-stats { display: flex; gap: 14px; width: 100%; }
.hs-stat-card {
  flex: 1; background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.22);
  border-radius: 22px; padding: 18px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.hs-stat-v { font-family: 'Fredoka', cursive; font-size: 26px; color: #fff; }
.hs-stat-l { color: #93c5fd; font-size: 11px; text-transform: uppercase; font-weight: 700; }

.btn-global {
  width: 100%; background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
  color: #1e3a8a; border: none; border-radius: 24px; padding: 22px;
  font-size: 24px; font-weight: 900; font-family: 'Fredoka', cursive; cursor: pointer;
  box-shadow: 0 6px 0 #ca8a04, 0 12px 24px rgba(234, 179, 8, 0.35);
  transition: transform 0.1s;
}
.btn-global:active { transform: translateY(4px); box-shadow: 0 2px 0 #ca8a04; }

/* ─── GAME SCREEN ─── */
.topbar { width: 100%; display: flex; align-items: center; padding: 24px 16px 12px; gap: 14px; }
.tb-home {
  width: 52px; height: 52px; background: rgba(255, 255, 255, 0.18); border: 2px solid rgba(255, 255, 255, 0.25);
  border-radius: 18px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 24px; box-shadow: 0 4px 0 rgba(0,0,0,0.15);
}
.score-container { flex: 1; display: flex; gap: 12px; }
.score-card {
  flex: 1; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.18);
  border-radius: 18px; padding: 8px 14px;
}
.sc-lbl { color: #93c5fd; font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
.sc-num { color: #fff; font-size: 28px; font-weight: 700; font-family: 'Fredoka', cursive; line-height: 1; }

/* ─── SCALED UP GRID SYSTEM ─── */
.grid-wrap {
  margin: 10px 12px; width: 366px; background: #090d16; border-radius: 24px;
  padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,0.4);
}
#grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.cell {
  aspect-ratio: 1; border-radius: 8px; background: rgba(255, 255, 255, 0.05);
  position: relative; transition: background 0.04s ease;
}
.cell.filled { border: none; }
.cell.pok { background: rgba(14, 165, 233, 0.35) !important; border: 2px solid #0ea5e9 !important; }
.cell.pbad { background: rgba(239, 68, 68, 0.3) !important; border: 2px solid #ef4444 !important; }
.cell.clearing { animation: cellClearAnim 0.28s ease forwards; }

/* ─── MODERN BLOCK DESIGN ─── */
.block-inner {
  width: 100%; height: 100%; border-radius: 8px;
  box-shadow: inset 0 3px 0 rgba(255,255,255,0.35), inset 0 -4px 0 rgba(0,0,0,0.25);
}

/* ─── SCALED UP TRAY SYSTEM ─── */
.tray {
  width: 366px; margin: 15px 12px; background: rgba(255, 255, 255, 0.08);
  border-radius: 24px; padding: 12px 6px; display: flex; justify-content: space-around;
  align-items: center; min-height: 140px; border: 2px solid rgba(255, 255, 255, 0.12);
}
.pslot { width: 114px; height: 114px; display: flex; align-items: center; justify-content: center; cursor: grab; }
.pslot.used { opacity: 0; pointer-events: none; }
.pslot.lifted { transform: scale(0.85); opacity: 0.3; }

.pgrid { display: grid; gap: 3px; }
.pc { border-radius: 5px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -3px 0 rgba(0,0,0,0.2); }
.pc.e { background: transparent !important; box-shadow: none !important; }

/* Drag paytidagi kattalashtirilgan obyekt */
#float { position: fixed; pointer-events: none; z-index: 9999; transform: scale(1.05); filter: drop-shadow(0 12px 20px rgba(0,0,0,0.35)); }

/* ─── GAME OVER SCREEN ─── */
#gov { background: rgba(9, 13, 22, 0.96); justify-content: center; gap: 28px; padding: 24px; z-index: 100; }
.go-title { font-family: 'Fredoka', cursive; font-size: 46px; color: #ef4444; text-shadow: 0 4px 12px rgba(239,68,68,0.2); }
.go-card { background: rgba(255,255,255,0.08); padding: 35px 55px; border-radius: 26px; text-align: center; border: 2px solid rgba(255,255,255,0.12); }

@keyframes cellClearAnim {
  0% { transform: scale(1); filter: brightness(2.2); }
  100% { transform: scale(0); opacity: 0; }
}

.combo-banner {
  position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
  background: linear-gradient(135deg, #f97316, #ea580c); padding: 14px 32px; border-radius: 32px;
  font-family: 'Fredoka', cursive; font-size: 24px; box-shadow: 0 12px 30px rgba(234, 88, 12, 0.5);
  opacity: 0; pointer-events: none; z-index: 90; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.combo-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>

<div id="app">
  <div id="hs">
    <div class="hs-title-box">
      <h1 class="hs-main-title">BLOCK<br>BLAST</h1>
      <p class="hs-sub-title">Premium Edition</p>
    </div>
    <div class="hs-stats">
      <div class="hs-stat-card"><span class="hs-stat-v" id="hs-best">0</span><span class="hs-stat-l">Best Score</span></div>
      <div class="hs-stat-card"><span class="hs-stat-v" id="hs-games">0</span><span class="hs-stat-l">Matches</span></div>
    </div>
    <button class="btn-global" id="play-btn">START GAME</button>
  </div>

  <div id="gs">
    <div class="topbar">
      <button class="tb-home" id="home-btn">🏠</button>
      <div class="score-container">
        <div class="score-card"><div class="sc-lbl">Score</div><div class="sc-num" id="sc-val">0</div></div>
        <div class="score-card"><div class="sc-lbl">Best</div><div class="sc-num" id="best-val">0</div></div>
      </div>
    </div>
    
    <div class="grid-wrap">
      <div id="grid"></div>
    </div>

    <div class="tray" id="tray"></div>
    <div class="combo-banner" id="combo-box">COMBO! 🔥</div>
  </div>

  <div id="gov">
    <h2 class="go-title">Out of Moves</h2>
    <div class="go-card">
      <div class="sc-lbl">Your Score</div>
      <div id="gov-score" style="font-size: 54px; font-weight: 800; font-family: 'Fredoka'; color: #fff; margin-top: 6px;">0</div>
    </div>
    <button class="btn-global" id="restart-btn" style="width: 85%;">PLAY AGAIN</button>
  </div>

  <div id="float" style="display:none;"></div>
</div>

<script>
// Kattalashtirilgan o'lchamlar (Scale Up configuration)
const R = 8, C = 8;
const MAIN_CELL_SIZE = 42;  // Asosiy o'yin katagi hajmi (Kattalashtirildi!)
const TRAY_CELL_SIZE = 22;  // Tray ichidagi shakllar hajmi (Oson ushlash uchun kattalashtirildi!)

const COLORS = [
  { bg: '#22c55e', sh: '#16a34a' }, // Yashil
  { bg: '#3b82f6', sh: '#2563eb' }, // Ko'k
  { bg: '#eab308', sh: '#ca8a04' }, // Sariq
  { bg: '#a855f7', sh: '#9333ea' }, // Siyohrang
  { bg: '#f97316', sh: '#ea580c' }, // To'q sariq
  { bg: '#ec4899', sh: '#db2777' }  // Pushti
];

const SHAPES_POOL = {
  easy: [
    { c: [[0,0]], w: 1, h: 1 },
    { c: [[0,0],[0,1]], w: 2, h: 1 }, { c: [[0,0],[1,0]], w: 1, h: 2 },
    { c: [[0,0],[0,1],[1,0],[1,1]], w: 2, h: 2 }
  ],
  medium: [
    { c: [[0,0],[0,1],[0,2]], w: 3, h: 1 }, { c: [[0,0],[1,0],[2,0]], w: 1, h: 3 },
    { c: [[0,0],[1,0],[1,1]], w: 2, h: 2 }, { c: [[0,1],[1,0],[1,1]], w: 2, h: 2 }
  ],
  hard: [
    { c: [[0,0],[0,1],[0,2],[0,3]], w: 4, h: 1 }, { c: [[0,0],[1,0],[2,0],[3,0]], w: 1, h: 4 },
    { c: [[0,0],[0,1],[0,2],[0,3],[0,4]], w: 5, h: 1 }, { c: [[0,0],[1,0],[2,0],[3,0],[4,0]], w: 1, h: 5 },
    { c: [[0,0],[1,0],[2,0],[2,1],[2,2]], w: 3, h: 3 },
    { c: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], w: 3, h: 3 }
  ]
};

let board = [], score = 0, best = 0, games = 0;
let pieces = [null, null, null], cellElements = [];
let dragData = { active: false, idx: -1, shape: null, color: null, gridRect: null };

function loadData() {
  try {
    best = +localStorage.getItem('bb_v4_best') || 0;
    games = +localStorage.getItem('bb_v4_games') || 0;
  } catch { best = 0; games = 0; }
}

function saveData() {
  try {
    localStorage.setItem('bb_v4_best', best);
    localStorage.setItem('bb_v4_games', games);
  } catch {}
}

// PERFORMANCE OPTIMIZATION: Kataklarni faqat bir marta generatsiya qilib keshlaymiz
function buildGridUI() {
  const grid = document.getElementById('grid');
  grid.innerHTML = ''; cellElements = [];
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      grid.appendChild(cell);
      cellElements.push(cell);
    }
  }
}

function getCellEl(r, c) { return cellElements[r * C + c]; }

function initGame() {
  board = Array.from({ length: R }, () => Array(C).fill(null));
  score = 0; pieces = [null, null, null]; dragData.active = false;
  buildGridUI(); generatePieces(); renderBoard(); renderPieces(); updateUI();
}

function getRandomShape() {
  const rand = Math.random();
  if (score < 300) return rand < 0.6 ? rndArr(SHAPES_POOL.easy) : rndArr(SHAPES_POOL.medium);
  if (score < 800) return rand < 0.2 ? rndArr(SHAPES_POOL.easy) : rand < 0.7 ? rndArr(SHAPES_POOL.medium) : rndArr(SHAPES_POOL.hard);
  return rand < 0.5 ? rndArr(SHAPES_POOL.hard) : rndArr(SHAPES_POOL.medium); // Anti-Infinity mexanizm
}

function rndArr(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generatePieces() {
  for (let i = 0; i < 3; i++) {
    if (!pieces[i]) pieces[i] = { sh: getRandomShape(), col: rndArr(COLORS) };
  }
}

// ULTRA FAST RENDER: innerHTML o'rniga faqat klasslar bilan ishlanadi (No Lags!)
function renderBoard(previewCells, isOk, clearingCells) {
  const clrSet = clearingCells ? new Set(clearingCells.map(([r,c]) => `${r},${c}`)) : null;
  const prevSet = previewCells ? new Set(previewCells.map(([r,c]) => `${r},${c}`)) : null;

  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      const el = getCellEl(r, c);
      const bCell = board[r][c];
      const key = `${r},${c}`;

      el.className = 'cell'; el.style.backgroundColor = ''; el.innerHTML = '';

      if (clrSet && clrSet.has(key)) {
        el.classList.add('clearing');
        el.style.backgroundColor = bCell ? bCell.bg : '#fff';
      } else if (bCell) {
        el.classList.add('filled');
        el.style.backgroundColor = bCell.bg;
        el.innerHTML = `<div class="block-inner" style="background:${bCell.bg};"></div>`;
      } else if (prevSet && prevSet.has(key)) {
        el.classList.add(isOk ? 'pok' : 'pbad');
      }
    }
  }
}

function renderPieces() {
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  pieces.forEach((p, i) => {
    const slot = document.createElement('div');
    slot.className = 'pslot' + (p ? '' : ' used');
    if (p) {
      const pgrid = document.createElement('div');
      pgrid.className = 'pgrid';
      pgrid.style.gridTemplateColumns = `repeat(${p.sh.w}, ${TRAY_CELL_SIZE}px)`;
      for (let r = 0; r < p.sh.h; r++) {
        for (let c = 0; c < p.sh.w; c++) {
          const has = p.sh.c.some(([rr, cc]) => rr === r && cc === c);
          const block = document.createElement('div');
          block.className = has ? 'pc' : 'pc e';
          block.style.cssText = `width:${TRAY_CELL_SIZE}px;height:${TRAY_CELL_SIZE}px;`;
          if (has) block.style.backgroundColor = p.col.bg;
          pgrid.appendChild(block);
        }
      }
      slot.appendChild(pgrid);
      slot.addEventListener('mousedown', e => startDrag(e, i));
      slot.addEventListener('touchstart', e => startDrag(e, i), { passive: false });
    }
    tray.appendChild(slot);
  });
}

function updateUI() {
  document.getElementById('sc-val').textContent = score;
  document.getElementById('best-val').textContent = best;
  document.getElementById('hs-best').textContent = best;
  document.getElementById('hs-games').textContent = games;
}

function getPointerPos(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

function getGridTarget(x, y) {
  const cellW = dragData.gridRect.width / C;
  const cellH = dragData.gridRect.height / R;
  return {
    row: Math.round((y - dragData.gridRect.top) / cellH - dragData.shape.h / 2),
    col: Math.round((x - dragData.gridRect.left) / cellW - dragData.shape.w / 2)
  };
}

function testPlacement(cells, rOff, cOff) {
  return cells.every(([r, c]) => {
    const nr = r + rOff, nc = c + cOff;
    return nr >= 0 && nr < R && nc >= 0 && nc < C && !board[nr][nc];
  });
}

function startDrag(e, idx) {
  if (!pieces[idx]) return; e.preventDefault();
  dragData.active = true; dragData.idx = idx;
  const p = pieces[idx]; dragData.shape = p.sh; dragData.color = p.col;
  dragData.gridRect = document.getElementById('grid').getBoundingClientRect();

  const floatBox = document.getElementById('float');
  floatBox.style.display = 'block'; floatBox.innerHTML = '';

  const pgrid = document.createElement('div');
  pgrid.className = 'pgrid';
  pgrid.style.cssText = `grid-template-columns:repeat(${p.sh.w}, ${MAIN_CELL_SIZE}px); gap: 3px;`;
  
  p.sh.c.forEach(() => {
    const b = document.createElement('div'); b.className = 'pc';
    b.style.cssText = `width:${MAIN_CELL_SIZE}px;height:${MAIN_CELL_SIZE}px;background:${p.col.bg};`;
    pgrid.appendChild(b);
  });
  
  floatBox.appendChild(pgrid);
  document.getElementById('tray').children[idx]?.classList.add('lifted');

  handleDrag(e);
  document.addEventListener('mousemove', handleDrag);
  document.addEventListener('touchmove', handleDrag, { passive: false });
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);
}

function handleDrag(e) {
  if (!dragData.active) return; e.preventDefault();
  const { x, y } = getPointerPos(e);
  const floatBox = document.getElementById('float');
  
  const offsetTargetY = y - 70; // Barmoq shaklni to'sib qo'ymasligi uchun teparoqqa offset
  floatBox.style.left = `${x - (dragData.shape.w * MAIN_CELL_SIZE) / 2}px`;
  floatBox.style.top = `${offsetTargetY - (dragData.shape.h * MAIN_CELL_SIZE) / 2}px`;

  const target = getGridTarget(x, offsetTargetY);
  const previewCells = dragData.shape.c.map(([r, c]) => [r + target.row, c + target.col]);
  renderBoard(previewCells, testPlacement(dragData.shape.c, target.row, target.col));
}

function endDrag(e) {
  if (!dragData.active) return; dragData.active = false;
  document.removeEventListener('mousemove', handleDrag); document.removeEventListener('touchmove', handleDrag);
  document.removeEventListener('mouseup', endDrag); document.removeEventListener('touchend', endDrag);

  document.getElementById('float').style.display = 'none';
  document.getElementById('tray').children[dragData.idx]?.classList.remove('lifted');

  const endEv = e.changedTouches ? e.changedTouches[0] : e;
  const target = getGridTarget(endEv.clientX, endEv.clientY - 70);

  if (testPlacement(dragData.shape.c, target.row, target.col)) {
    executePlacement(dragData.idx, target.row, target.col);
  } else {
    renderBoard();
  }
}

function executePlacement(idx, row, col) {
  const p = pieces[idx];
  p.sh.c.forEach(([r, c]) => { board[r + row][c + col] = p.col; });
  pieces[idx] = null; score += p.sh.c.length;
  
  setTimeout(() => checkAndClearLines(), 50);
}

function checkAndClearLines() {
  const rowsToClear = [], colsToClear = [];
  for (let r = 0; r < R; r++) if (board[r].every(v => v)) rowsToClear.push(r);
  for (let c = 0; c < C; c++) if (board.map(row => row[c]).every(v => v)) colsToClear.push(c);

  const clearCoords = [];
  rowsToClear.forEach(r => { for(let c=0; c<C; c++) clearCoords.push([r, c]); });
  colsToClear.forEach(c => { for(let r=0; r<R; r++) clearCoords.push([r, c]); });

  if (clearCoords.length > 0) {
    renderBoard(null, false, clearCoords);
    const totalLines = rowsToClear.length + colsToClear.length;
    setTimeout(() => {
      clearCoords.forEach(([r, c]) => board[r][c] = null);
      score += totalLines * 100 + clearCoords.length * 5;
      if (totalLines >= 2) triggerComboBanner();
      if (score > best) { best = score; saveData(); }
      postMoveSequence();
    }, 180);
  } else {
    if (score > best) { best = score; saveData(); }
    postMoveSequence();
  }
}

function postMoveSequence() {
  if (pieces.every(p => p === null)) generatePieces();
  renderPieces(); renderBoard(); updateUI();
  
  if (!checkAvailableMoves()) {
    setTimeout(() => { games++; saveData(); showGameOverScreen(); }, 200);
  }
}

function checkAvailableMoves() {
  return pieces.some(p => {
    if (!p) return false;
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        if (testPlacement(p.sh.c, r, c)) return true;
      }
    }
    return false;
  });
}

function triggerComboBanner() {
  const box = document.getElementById('combo-box');
  box.classList.add('show');
  setTimeout(() => box.classList.remove('show'), 600);
}

function showScreen(id) {
  ['hs', 'gs', 'gov'].forEach(s => document.getElementById(s).style.display = 'none');
  document.getElementById(id).style.display = 'flex';
}

function showGameOverScreen() {
  document.getElementById('gov-score').textContent = score;
  showScreen('gov');
}

loadData();
document.getElementById('play-btn').addEventListener('click', () => { showScreen('gs'); initGame(); });
document.getElementById('home-btn').addEventListener('click', () => { showScreen('hs'); updateUI(); });
document.getElementById('restart-btn').addEventListener('click', () => { showScreen('gs'); initGame(); });

showScreen('hs');
updateUI();
</script>
</body>
</html>
