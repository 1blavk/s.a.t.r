<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glow Block Puzzle Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #090514;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Outfit', sans-serif;
  color: #fff;
}

#app {
  width: 390px;
  height: 844px;
  background: radial-gradient(circle at 50% 0%, #1a0f3c 0%, #080318 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  position: relative;
  border-radius: 32px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.1);
}

/* ─── CHUQUR FON EFFEKTLARI ─── */
.bg-glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: #7928ca;
  filter: blur(120px);
  opacity: 0.3;
  top: 20%;
  pointer-events: none;
  z-index: 0;
}

.stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--d, 2s) ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0.1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.5); } }

/* ─── HOME SCREEN ─── */
#hs {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 60px 24px 60px;
  position: relative;
  z-index: 1;
}

.brand-wrapper {
  text-align: center;
  margin-top: 20px;
}

.hs-title {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
  line-height: 1;
}

.hs-sub {
  color: #6366f1;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: 8px;
  font-weight: 600;
}

.hs-deco { display: flex; gap: 8px; margin: 40px 0; }
.hs-db {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  animation: floatUp 2s ease-in-out infinite alternate;
  animation-delay: var(--dl, 0s);
  box-shadow: 0 0 12px var(--c);
}
@keyframes floatUp { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }

.hs-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: 100%;
}
.hs-stat {
  border-radius: 20px;
  padding: 16px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
}
.hs-stat-ico { font-size: 20px; margin-bottom: 6px; }
.hs-stat-v { color: #fff; font-size: 20px; font-weight: 800; }
.hs-stat-l { color: #94a3b8; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

.play-btn {
  width: 100%;
  background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 22px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
  transition: all 0.2s;
}
.play-btn:active { transform: scale(0.98); opacity: 0.9; }

/* ─── GAME SCREEN ─── */
#gs { width: 100%; height: 100%; display: none; flex-direction: column; justify-content: space-between; padding: 20px 16px 30px; position: relative; z-index: 1; }

.topbar { width: 100%; display: flex; align-items: center; gap: 12px; }
.tb-home {
  width: 50px; height: 50px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 20px; transition: background 0.2s;
}
.tb-home:active { background: rgba(255, 255, 255, 0.1); }

.score-cards { flex: 1; display: flex; gap: 10px; }
.sc-card {
  flex: 1; border-radius: 16px; padding: 6px 16px;
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
}
.sc-lbl { color: #94a3b8; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
.sc-num { color: #fff; font-size: 22px; font-weight: 800; }

/* GRID (O'YIN MAYDONI) */
.grid-wrap {
  width: 100%;
  background: rgba(2, 1, 6, 0.6);
  border-radius: 28px;
  padding: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 4px 20px rgba(0,0,0,0.6);
  position: relative;
}
#grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.cell {
  aspect-ratio: 1; border-radius: 8px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.03);
  position: relative;
  transition: background 0.1s, border 0.1s;
}

/* JONLI BLOKLAR */
.cell.filled { border: none; animation: blockPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes blockPop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

/* PREVIEW STATUS */
.cell.pok { background: rgba(99, 102, 241, 0.25) !important; border: 1px solid #6366f1 !important; }
.cell.pbad { background: rgba(239, 68, 68, 0.15) !important; border: 1px solid #ef4444 !important; }

/* MUKAMMAL PORTLASH ANIMATSIYASI */
.cell.clearing { animation: pulseGlow 0.4s ease-out forwards; border: none; }
@keyframes pulseGlow {
  0% { transform: scale(1); filter: brightness(2) blur(0px); opacity: 1; }
  50% { transform: scale(1.1); filter: brightness(1.5) blur(2px); opacity: 0.8; }
  100% { transform: scale(0); filter: brightness(1); opacity: 0; }
}

.block-inner {
  width: 100%; height: 100%; border-radius: 8px;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.3);
}

/* COMBO BANNER */
.combo-wrap {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  display: none; z-index: 15; pointer-events: none;
}
.combo-inner {
  background: linear-gradient(135deg, #ec4899, #8b5cf6);
  color: #fff; font-size: 24px; font-weight: 900;
  padding: 12px 36px; border-radius: 50px; white-space: nowrap;
  box-shadow: 0 10px 30px rgba(139, 92, 246, 0.6);
  animation: comboEpic 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards;
}
@keyframes comboEpic {
  0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
  30% { opacity: 1; transform: scale(1.1) rotate(5deg); }
  100% { opacity: 0; transform: scale(0.9) translateY(-40px); }
}

/* TRAY (PASTKI PANEL) */
.tray {
  width: 100%;
  background: rgba(255,255,255,0.02); border-radius: 24px; padding: 16px 8px;
  display: flex; justify-content: space-around; align-items: center; min-height: 130px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.pslot {
  display: flex; align-items: center; justify-content: center;
  width: 105px; height: 105px; cursor: grab;
  transition: transform 0.2s, opacity 0.2s;
}
.pslot.used { opacity: 0; pointer-events: none; }
.pslot.lifted { opacity: 0.3; transform: scale(0.8); }

.pgrid { display: grid; gap: 3px; }
.pc { border-radius: 4px; box-shadow: inset 0 1px 2px rgba(255,255,255,0.3); }
.pc.e { background: transparent !important; box-shadow: none !important; }

/* FLOATING PIECE (SUDRALAYOTGAN BLOK) */
#float {
  position: fixed; pointer-events: none; z-index: 1000;
  transform: scale(1.15); /* Sudrab ketayotganda biroz kattalashadi */
  filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
  transition: transform 0.1s;
}

/* INFOBAR */
.btm-bar { display: flex; gap: 10px; width: 100%; }
.btm-pill {
  flex: 1; border-radius: 14px; padding: 10px 16px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
  display: flex; justify-content: space-between; align-items: center;
}
.btm-lbl { color: #64748b; font-size: 11px; text-transform: uppercase; font-weight: 600; }
.btm-val { color: #fff; font-size: 14px; font-weight: 700; }

/* SCORE POPUP */
.spop {
  position: absolute; color: #fbbf24; font-size: 22px; font-weight: 900;
  pointer-events: none; z-index: 20; text-shadow: 0 4px 12px rgba(0,0,0,0.8);
  animation: scoreRise 0.8s ease-out forwards;
}
@keyframes scoreRise { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 100% { opacity: 0; transform: translateY(-60px) scale(1.2); } }

/* GAME OVER */
#gov {
  position: absolute; inset: 0; background: rgba(5, 2, 12, 0.95);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 30; padding: 24px; gap: 20px;
}
.go-title { font-size: 36px; font-weight: 900; color: #ef4444; text-transform: uppercase; }
.go-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px; padding: 30px 50px; text-align: center; width: 80%;
}
.go-lbl { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
.go-num { font-size: 56px; font-weight: 900; color: #fff; margin: 8px 0; }
.go-best { font-size: 14px; color: #fbbf24; font-weight: 600; }
.go-play {
  width: 100%; background: #fff; color: #000; border: none; border-radius: 18px;
  padding: 18px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.2s;
}
.go-play:active { transform: scale(0.98); }
.go-home { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #94a3b8; border-radius: 16px; padding: 12px 30px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<div id="app">
  <div class="bg-glow"></div>
  <div class="stars" id="stars"></div>

  <!-- HOME SCREEN -->
  <div id="hs">
    <div class="brand-wrapper">
      <h1 class="hs-title">Glow Block</h1>
      <div class="hs-sub">Puzzle Challenge</div>
    </div>
    
    <div class="hs-deco" id="hs-deco"></div>
    
    <div class="hs-stats">
      <div class="hs-stat"><div class="hs-stat-ico">🏆</div><div class="hs-stat-v" id="hs-best">0</div><div class="hs-stat-l">Best</div></div>
      <div class="hs-stat"><div class="hs-stat-ico">🎮</div><div class="hs-stat-v" id="hs-games">0</div><div class="hs-stat-l">Games</div></div>
      <div class="hs-stat"><div class="hs-stat-ico">⚡</div><div class="hs-stat-v" id="hs-lines">0</div><div class="hs-stat-l">Lines</div></div>
    </div>
    
    <button class="play-btn" id="play-btn">START GAME</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gs">
    <div class="topbar">
      <button class="tb-home" id="home-btn">🏠</button>
      <div class="score-cards">
        <div class="sc-card"><div class="sc-lbl">Score</div><div class="sc-num" id="sc-val">0</div></div>
        <div class="sc-card"><div class="sc-lbl">Best</div><div class="sc-num" id="best-val">0</div></div>
      </div>
    </div>
    
    <div class="grid-wrap" id="grid-wrap">
      <div id="grid"></div>
      <div class="combo-wrap" id="combo-wrap"><div class="combo-inner" id="combo-inner">COMBO! 🔥</div></div>
    </div>
    
    <div class="btm-bar">
      <div class="btm-pill"><span class="btm-lbl">Lines</span><span class="btm-val" id="lv">0</span></div>
      <div class="btm-pill"><span class="btm-lbl">Blocks</span><span class="btm-val" id="bv">0</span></div>
    </div>
    
    <div class="tray" id="tray"></div>
  </div>

  <!-- GAME OVER OVERLAY -->
  <div id="gov">
    <div class="go-title">Game Over</div>
    <div class="go-card">
      <div class="go-lbl">Final Score</div>
      <div class="go-num" id="gov-score">0</div>
      <div class="go-best" id="gov-best">Best: 0</div>
    </div>
    <button class="go-play" id="restart-btn">PLAY AGAIN</button>
    <button class="go-home" id="home-go">MAIN MENU</button>
  </div>

  <div id="float" style="display:none;"></div>
</div>

<script>
// Neon va Jonli Cyber ranglar palitrasi (Glow effekti bilan)
const BLOCK_COLORS = [
  { bg: '#ff0055', shadow: 'rgba(255, 0, 85, 0.5)' },
  { bg: '#00ffcc', shadow: 'rgba(0, 255, 204, 0.5)' },
  { bg: '#3300ff', shadow: 'rgba(51, 0, 255, 0.5)' },
  { bg: '#ffcc00', shadow: 'rgba(255, 204, 0, 0.5)' },
  { bg: '#ff00ff', shadow: 'rgba(255, 0, 255, 0.5)' },
  { bg: '#00ff00', shadow: 'rgba(0, 255, 0, 0.5)' },
  { bg: '#7928ca', shadow: 'rgba(121, 40, 202, 0.5)' }
];

const SHAPES = [
  { c: [[0,0]], w: 1, h: 1 },
  { c: [[0,0],[0,1]], w: 2, h: 1 }, { c: [[0,0],[1,0]], w: 1, h: 2 },
  { c: [[0,0],[0,1],[0,2]], w: 3, h: 1 }, { c: [[0,0],[1,0],[2,0]], w: 1, h: 3 },
  { c: [[0,0],[0,1],[1,0],[1,1]], w: 2, h: 2 },
  { c: [[0,0],[1,0],[2,0],[2,1]], w: 2, h: 3 }, { c: [[0,1],[1,1],[2,0],[2,1]], w: 2, h: 3 },
  { c: [[0,0],[0,1],[0,2],[1,1]], w: 3, h: 2 },
  { c: [[0,0],[1,0],[1,1]], w: 2, h: 2 }, { c: [[0,1],[1,0],[1,1]], w: 2, h: 2 }
];

const R = 8, C = 8;
let board, score, best, games, tLines, tBlocks, pieces, dragging, dIdx, dShape, dColor;

function ld() {
  try {
    best = +localStorage.getItem('bgp_best') || 0;
    games = +localStorage.getItem('bgp_games') || 0;
    tLines = +localStorage.getItem('bgp_lines') || 0;
  } catch(e) { best = 0; games = 0; tLines = 0; }
}
function sv() {
  try {
    localStorage.setItem('bgp_best', best);
    localStorage.setItem('bgp_games', games);
    localStorage.setItem('bgp_lines', tLines);
  } catch(e) {}
}

function init() {
  board = Array.from({ length: R }, () => Array(C).fill(null));
  score = 0; tBlocks = 0; pieces = [null, null, null]; dragging = false;
  genPieces(); buildGrid(); renderBoard(); renderPieces(); updUI();
}

function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function genPieces() { for(let i=0; i<3; i++) if(pieces[i] === null) pieces[i] = { sh: rnd(SHAPES), col: rnd(BLOCK_COLORS) }; }

function buildGrid() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  for(let r=0; r<R; r++) for(let c=0; c<C; c++) {
    const el = document.createElement('div'); el.className = 'cell';
    el.dataset.r = r; el.dataset.c = c; g.appendChild(el);
  }
}

function cel(r, c) { return document.getElementById('grid').children[r * C + c]; }

function mkPc(bg, shadow, sz) {
  const d = document.createElement('div'); d.className = 'pc';
  d.style.cssText = `width:${sz}px;height:${sz}px;background:${bg};box-shadow: 0 0 8px ${shadow};`;
  const inner = document.createElement('div'); inner.className = 'block-inner';
  d.appendChild(inner);
  return d;
}

function renderBoard(prev, ok, clr) {
  for(let r=0; r<R; r++) for(let c=0; c<C; c++) {
    const el = cel(r, c);
    el.className = 'cell'; el.innerHTML = ''; el.style.background = ''; el.style.boxShadow = '';
    
    const isClr = clr && clr.some(([rr, cc]) => rr === r && cc === c);
    if(isClr) {
      el.classList.add('clearing');
      el.style.background = board[r][c] ? board[r][c].bg : '#fff';
      el.style.boxShadow = board[r][c] ? `0 0 20px ${board[r][c].shadow}` : 'none';
    } else if(board[r][c]) {
      el.classList.add('filled');
      el.style.background = board[r][c].bg;
      el.style.boxShadow = `0 0 10px ${board[r][c].shadow}`;
      el.appendChild(mkPc(board[r][c].bg, board[r][c].shadow, '100%'));
    } else if(prev && prev.some(([rr, cc]) => rr === r && cc === c)) {
      el.classList.add(ok ? 'pok' : 'pbad');
    }
  }
}

function renderPieces() {
  const tray = document.getElementById('tray'); tray.innerHTML = '';
  pieces.forEach((p, i) => {
    const sl = document.createElement('div');
    sl.className = 'pslot' + (p ? '' : ' used'); sl.dataset.i = i;
    if(p) {
      const pg = document.createElement('div'); pg.className = 'pgrid';
      pg.style.gridTemplateColumns = `repeat(${p.sh.w}, 22px)`;
      for(let r=0; r<p.sh.h; r++) for(let c=0; c<p.sh.w; c++) {
        const has = p.sh.c.some(([rr, cc]) => rr === r && cc === c);
        if(has) pg.appendChild(mkPc(p.col.bg, p.col.shadow, 22));
        else { const e = document.createElement('div'); e.className = 'pc e'; e.style.cssText = 'width:22px;height:22px;'; pg.appendChild(e); }
      }
      sl.appendChild(pg);
      sl.addEventListener('mousedown', e => startD(e, i));
      sl.addEventListener('touchstart', e => startD(e, i), { passive: false });
    }
    tray.appendChild(sl);
  });
}

function updUI() {
  document.getElementById('sc-val').textContent = score;
  document.getElementById('best-val').textContent = best;
  document.getElementById('lv').textContent = tLines;
  document.getElementById('bv').textContent = tBlocks;
}

function getXY(e) { return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }

function getGP(x, y) {
  const gi = document.getElementById('grid').getBoundingClientRect();
  const cw = gi.width / C, ch = gi.height / R;
  // Silliq tekshirish uchun barmog'imiz koordinatasini o'rtacha hisoblaymiz
  return {
    row: Math.round((y - gi.top) / ch - dShape.h / 2),
    col: Math.round((x - gi.left) / cw - dShape.w / 2)
  };
}

function canPlace(cells, row, col) {
  return cells.every(([r, c]) => { const nr = r + row, nc = c + col; return nr >= 0 && nr < R && nc >= 0 && nc < C && !board[nr][nc]; });
}

// DRAG START: Y o'qi bo'yicha offset qo'shildi (Barmoq ostida ko'rinishi uchun)
function startD(e, i) {
  if(!pieces[i]) return; e.preventDefault();
  dIdx = i; dragging = true;
  const p = pieces[i]; dShape = p.sh; dColor = p.col;
  
  const fl = document.getElementById('float'); fl.style.display = 'block'; fl.innerHTML = '';
  const pg = document.createElement('div'); pg.className = 'pgrid';
  pg.style.cssText = `grid-template-columns:repeat(${p.sh.w}, 36px); gap: 4px;`;
  for(let r=0; r<p.sh.h; r++) for(let c=0; c<p.sh.w; c++) {
    const has = p.sh.c.some(([rr, cc]) => rr === r && cc === c);
    if(has) pg.appendChild(mkPc(p.col.bg, p.col.shadow, 36));
    else { const ev = document.createElement('div'); ev.style.cssText = 'width:36px;height:36px;'; pg.appendChild(ev); }
  }
  fl.appendChild(pg);
  document.getElementById('tray').children[i]?.classList.add('lifted');
  
  moveD(e);
  document.addEventListener('mousemove', moveD); document.addEventListener('touchmove', moveD, { passive: false });
  document.addEventListener('mouseup', endD); document.addEventListener('touchend', endD);
}

// DRAG MOVE: Mobil qurilmalarda block barmoqdan 60px TEPADA yuradi!
function moveD(e) {
  if(!dragging) return; e.preventDefault();
  const { x, y } = getXY(e);
  const fl = document.getElementById('float');
  
  const offsetTargetY = y - 60; // UX yechim shu yerda
  fl.style.left = (x - (dShape.w * 36) / 2) + 'px';
  fl.style.top = (offsetTargetY - (dShape.h * 36) / 2) + 'px';
  
  const { row, col } = getGP(x, offsetTargetY);
  const prev = dShape.c.map(([r, c]) => [r + row, c + col]);
  renderBoard(prev, canPlace(dShape.c, row, col));
}

function endD(e) {
  if(!dragging) return; dragging = false;
  document.removeEventListener('mousemove', moveD); document.removeEventListener('touchmove', moveD);
  document.removeEventListener('mouseup', endD); document.removeEventListener('touchend', endD);
  
  document.getElementById('float').style.display = 'none';
  document.getElementById('tray').children[dIdx]?.classList.remove('lifted');
  
  const pos = e.changedTouches ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY } : { x: e.clientX, y: e.clientY };
  const { row, col } = getGP(pos.x, pos.y - 60);
  
  if(canPlace(dShape.c, row, col)) placePiece(dIdx, row, col);
  else renderBoard();
}

function placePiece(idx, row, col) {
  const p = pieces[idx], placed = [];
  p.sh.c.forEach(([r, c]) => { board[r + row][c + col] = p.col; placed.push([r + row, c + col]); });
  pieces[idx] = null; tBlocks += p.sh.c.length; score += p.sh.c.length;
  
  showSpop(p.sh.c.length, row, col);
  setTimeout(() => checkLines(placed), 150);
}

function checkLines(placed) {
  const fr = [], fc = [];
  for(let r=0; r<R; r++) if(board[r].every(v => v)) fr.push(r);
  for(let c=0; c<C; c++) if(board.map(ro => ro[c]).every(v => v)) fc.push(c);
  
  const cs = new Set();
  fr.forEach(r => { for(let c=0; c<C; c++) cs.add(r * C + c); });
  fc.forEach(c => { for(let r=0; r<R; r++) cs.add(r * C + c); });
  const ca = [...cs].map(k => [Math.floor(k / C), k % C]);
  
  if(ca.length) {
    renderBoard(null, false, ca);
    const lc = fr.length + fc.length; tLines += lc;
    setTimeout(() => {
      ca.forEach(([r, c]) => board[r][c] = null);
      const pts = lc * 100 + ca.length * 5 + (lc >= 2 ? lc * 50 : 0);
      score += pts; if(lc >= 2) showCombo(lc);
      showSpop(pts, ca[0][0], ca[0][1]);
      if(score > best) { best = score; sv(); } updUI(); afterPlace();
    }, 350);
  } else { if(score > best) { best = score; sv(); } updUI(); afterPlace(); }
}

function afterPlace() {
  if(pieces.every(p => p === null)) genPieces();
  renderPieces(); renderBoard(); updUI();
  if(!hasMove()) setTimeout(() => { games++; sv(); showGO(); }, 300);
}

function hasMove() {
  return pieces.some(p => {
    if(!p) return false;
    for(let r=0; r<R; r++) for(let c=0; c<C; c++) if(canPlace(p.sh.c, r, c)) return true;
    return false;
  });
}

function showCombo(n) {
  const w = document.getElementById('combo-wrap'), inn = document.getElementById('combo-inner');
  inn.textContent = n >= 3 ? `🔥 ${n}X COMBO EPIC! 🔥` : '🔥 COMBO! 🔥';
  w.style.display = 'block'; inn.style.animation = 'none';
  void inn.offsetWidth; inn.style.animation = 'comboEpic 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards';
  setTimeout(() => w.style.display = 'none', 800);
}

function showSpop(pts, row, col) {
  const app = document.getElementById('app');
  const gi = document.getElementById('grid').getBoundingClientRect();
  const ar = app.getBoundingClientRect();
  const cw = gi.width / C, ch = gi.height / R;
  const x = gi.left - ar.left + col * cw + cw / 2 - 10;
  const y = gi.top - ar.top + row * ch - 8;
  
  const sp = document.createElement('div'); sp.className = 'spop';
  sp.textContent = '+' + pts; sp.style.left = x + 'px'; sp.style.top = y + 'px';
  app.appendChild(sp); setTimeout(() => sp.remove(), 750);
}

function showGO() {
  document.getElementById('gov-score').textContent = score;
  document.getElementById('gov-best').textContent = score >= best ? '🏆 NEW RECORD!' : 'Best: ' + best;
  document.getElementById('gov').style.display = 'flex';
}

function showHome() {
  document.getElementById('gs').style.display = 'none';
  document.getElementById('gov').style.display = 'none';
  document.getElementById('hs').style.display = 'flex';
  document.getElementById('hs-best').textContent = best;
  document.getElementById('hs-games').textContent = games;
  document.getElementById('hs-lines').textContent = tLines;
}

function showGame() {
  document.getElementById('hs').style.display = 'none';
  document.getElementById('gov').style.display = 'none';
  document.getElementById('gs').style.display = 'flex';
  init();
}

function buildDeco() {
  const w = document.getElementById('hs-deco'); w.innerHTML = '';
  BLOCK_COLORS.slice(0, 6).forEach((c, i) => {
    const b = document.createElement('div'); b.className = 'hs-db';
    b.style.cssText = `--c:${c.shadow}; background:${c.bg}; --dl:${i * 0.15}s;`;
    w.appendChild(b);
  });
}

function buildStars() {
  const sw = document.getElementById('stars'); sw.innerHTML = '';
  for(let i=0; i<40; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const sz = Math.random() < 0.3 ? 2 : 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${1.5+Math.random()*3}s;animation-delay:${Math.random()*2}s;`;
    sw.appendChild(s);
  }
}

ld(); buildStars(); buildDeco();
document.getElementById('play-btn').addEventListener('click', showGame);
document.getElementById('home-btn').addEventListener('click', showHome);
document.getElementById('restart-btn').addEventListener('click', () => { document.getElementById('gov').style.display = 'none'; init(); });
document.getElementById('home-go').addEventListener('click', showHome);
showHome();
</script>
